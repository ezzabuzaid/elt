# Codex installs a plugin by copying its folder from a git ref, with no
# install or build step, so it needs the bundled server beside the skills.
# Main keeps only source; this workflow publishes the runnable marketplace to
# the release branch, which Codex installs from (--ref release).
name: Apple plugin release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apple-plugin-release
  cancel-in-progress: true

jobs:
  release:
    # The EventKit helper compiles against the macOS 27 SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Every push, not nx affected: skills and hooks under plugins/apple
      # belong to no project, and an unchanged build publishes no commit. A
      # failing test stops the publish. The runner has no ChatGPT app, so the
      # end-to-end tests launch the plugin on this job's Node instead of
      # Codex's bundled one.
      - run: CODEX_MCP_NODE_PATH="$(command -v node)" npx nx run-many -t test marketplace -p apple-plugin
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: dist/apple-plugin-marketplace
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: 'apple plugin from ${{ github.sha }}'
          disable_nojekyll: true
