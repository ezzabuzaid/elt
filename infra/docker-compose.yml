# Local Postgres warehouse; consumers may connect directly as agent_reader.
# Start: npx nx run infra:up (reset the volume: npx nx run infra:reset)
# Stop it and leave SQL Server running: npx nx run infra:down-warehouse
# SQL Server, for the SQL Server source: npx nx run infra:up-sqlserver
# Grafana with the crawl dashboard, for OpenTelemetry: npx nx run infra:up-otel
name: elt

services:
  warehouse:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-agent}
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      # The 18 image keeps PGDATA under /var/lib/postgresql/18/docker.
      - warehouse:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d warehouse]
      interval: 2s
      timeout: 5s
      retries: 30

  # Optional MCP transport: the server holds the reader's
  # password, runs every statement in a read-only transaction, rejects
  # statements that would end it, and cancels anything past 30 seconds.
  # Pinned: 0.3.0 is the latest release and serves stdio or SSE only.
  warehouse-mcp:
    image: crystaldba/postgres-mcp:0.3.0
    command:
      - --access-mode=restricted
      - --transport=sse
      - --sse-host=0.0.0.0
    environment:
      DATABASE_URI: postgresql://agent_reader:${AGENT_PASSWORD:-agent}@warehouse:5432/warehouse
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      warehouse:
        condition: service_healthy

  # Microsoft publishes the image for amd64 only, so on Apple silicon it runs
  # emulated; it sits in a profile so a plain `up` starts only the warehouse.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Context-Compiler-1}
    ports:
      - 127.0.0.1:51433:1433
    volumes:
      - sqlserver:/var/opt/mssql
    healthcheck:
      test:
        [
          CMD-SHELL,
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 120s

  # Grafana, Prometheus, Tempo and Loki behind one OpenTelemetry Collector,
  # which takes OTLP over HTTP on 4318; Grafana provisions the dashboards of
  # elt-opentelemetry. It sits in a profile, as SQL Server does.
  otel:
    image: grafana/otel-lgtm:0.39.0
    profiles: [otel]
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:4318:4318
    volumes:
      - otel:/data
      - ./otel/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/elt.yaml:ro
      - ../packages/opentelemetry/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/elt:ro
    # The image's own check, which waits for every backend, more often than
    # its 30 seconds, so up --wait returns soon after the stack is ready.
    healthcheck:
      test: [CMD, /otel-lgtm/docker/healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  warehouse:
  sqlserver:
  otel:
